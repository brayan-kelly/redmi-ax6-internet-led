name: Publish Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OPENWRT_VERSION: 25.12.5
  OPENWRT_TARGET: qualcommax/ipq807x
  OPENWRT_ARCH: aarch64_cortex-a53
  SDK_NAME: openwrt-sdk-25.12.5-qualcommax-ipq807x_gcc-14.3.0_musl.Linux-x86_64
  PACKAGE_NAME: luci-app-internet-led

jobs:
  build-feed:
    name: Build package and signed feed
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read

    outputs:
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get release metadata
        id: release
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$TAG_NAME" == *-beta* || "$TAG_NAME" == *-rc* || "$TAG_NAME" == *-alpha* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools rsync \
            unzip zlib1g-dev file wget tar zstd

      - name: Download OpenWrt SDK
        run: |
          SDK_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}/${SDK_NAME}.tar.zst"
          wget "$SDK_URL"
          tar -xf "${SDK_NAME}.tar.zst"

      - name: Build package
        shell: bash
        run: |
          PACKAGE_DIR="${SDK_NAME}/package/${PACKAGE_NAME}"
          mkdir -p "$PACKAGE_DIR"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.DS_Store' \
            --exclude='*.tar.gz' \
            --exclude='*.tar.zst' \
            --exclude='*.apk' \
            --exclude='*.ipk' \
            --exclude="${SDK_NAME}" \
            --exclude='package-artifacts' \
            ./ "$PACKAGE_DIR/"
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${{ steps.release.outputs.version }}/" "$PACKAGE_DIR/Makefile"
          (cd "$SDK_NAME" && ./scripts/feeds update -a && ./scripts/feeds install luci-base jsonfilter)
          make -C "$SDK_NAME" defconfig
          make -C "$SDK_NAME" package/${PACKAGE_NAME}/compile V=s
          mkdir -p package-artifacts site/feed/${OPENWRT_ARCH}
          PACKAGE_PATH="$(find "${SDK_NAME}/bin/packages" -type f -name "${PACKAGE_NAME}-*.apk" -print -quit)"
          test -n "$PACKAGE_PATH"
          cp "$PACKAGE_PATH" package-artifacts/
          cp keys/internet-led.pub package-artifacts/
          cp keys/internet-led.pub site/feed/internet-led.pub
          (cd package-artifacts && sha256sum ./*.apk > SHA256SUMS)
          cp package-artifacts/*.apk site/feed/${OPENWRT_ARCH}/

      - name: Sign feed index
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        shell: bash
        run: |
          test -n "$APK_SIGNING_KEY" || { echo 'Missing APK_SIGNING_KEY Actions secret'; exit 1; }
          KEY_FILE="$RUNNER_TEMP/internet-led-signing.key"
          printf '%s\n' "$APK_SIGNING_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          mkdir -p "$RUNNER_TEMP/apk-root"
          APK_TOOL="${SDK_NAME}/staging_dir/host/bin/apk"
          test -x "$APK_TOOL"
          cd "site/feed/${OPENWRT_ARCH}"
          "$GITHUB_WORKSPACE/$APK_TOOL" mkndx \
            --root "$RUNNER_TEMP/apk-root" \
            --keys-dir "$GITHUB_WORKSPACE/keys" \
            --allow-untrusted \
            --sign "$KEY_FILE" \
            --output packages.adb \
            ./*.apk
          rm -f "$KEY_FILE"

      - name: Upload signed feed for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: package-artifacts/
          if-no-files-found: error

  deploy-feed:
    name: Deploy signed feed
    needs: build-feed
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  create-release:
    name: Publish GitHub release
    needs: [build-feed, deploy-feed]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: package-artifacts
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-feed.outputs.tag }}
          name: Release ${{ needs.build-feed.outputs.tag }}
          draft: false
          prerelease: ${{ needs.build-feed.outputs.prerelease }}
          make_latest: ${{ needs.build-feed.outputs.prerelease == 'false' }}
          files: |
            package-artifacts/*.apk
            package-artifacts/SHA256SUMS
            package-artifacts/internet-led.pub
